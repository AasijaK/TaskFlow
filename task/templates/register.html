<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="nav-logo">Task<span>Flow</span></a>
          <h1>Get started</h1>
          <p class="text-muted">Create your account to start managing your tasks with clarity.</p>
        </div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="fullName" class="form-label">Full name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required>
            <span class="error-message" id="nameError">Full name is required.</span>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
            <span class="error-message" id="emailError">Please enter a valid email address.</span>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" placeholder="••••••••" required>
              <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span class="error-message" id="passwordError">Password is required.</span>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <div class="password-wrapper">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
              <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span class="error-message" id="confirmPasswordError">Passwords do not match.</span>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="login.html" class="auth-link">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
