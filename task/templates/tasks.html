<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Tasks — TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/tasks.css">
</head>
<body class="app-page">

  <div class="app-shell">
    <!-- Sidebar Navigation (Shared) -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="index.html" class="nav-logo">Task<span>Flow</span></a>
      </div>

      <nav class="sidebar-nav">
        <ul class="nav-list">
          <li>
            <a href="dashboard.html" class="nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="tasks.html" class="nav-item active">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
              <span>All Tasks</span>
            </a>
          </li>
          <li>
            <a href="categories.html" class="nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Categories</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">JD</div>
          <div class="user-info">
            <span class="user-name">User Name</span>
            <a href="settings.html" class="user-settings-link">Settings</a>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile Nav Toggle -->
    <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle navigation">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="page-header">
        <div class="header-title-area">
          <h1>All Tasks</h1>
          <p class="text-muted">Organize and track everything you need to get done.</p>
        </div>
        <div class="header-actions">
          <a href="task-form.html" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Create Task</span>
          </a>
        </div>
      </header>

      <!-- Task Controls Area -->
      <section class="task-controls">
        <div class="search-bar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="taskSearch" placeholder="Search tasks...">
        </div>

        <div class="filter-group">
          <div class="filter-item">
            <label for="statusFilter" class="filter-label">Status</label>
            <select id="statusFilter">
              <option value="all">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="priorityFilter" class="filter-label">Priority</label>
            <select id="priorityFilter">
              <option value="all">All Priorities</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="sortControl" class="filter-label">Sort By</label>
            <select id="sortControl">
              <option value="due-date">Due Date</option>
              <option value="created-date">Creation Date</option>
              <option value="priority">Priority</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Task List Area -->
      <section class="task-list-container">
        <div id="taskList" class="empty-state-card">
          <div class="empty-state-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="empty-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
            <h3 id="emptyStateTitle">No tasks found</h3>
            <p class="text-muted" id="emptyStateText">Your task list is empty. Start by creating your first task!</p>
            <a href="task-form.html" class="btn btn-secondary">Create Task</a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/dashboard.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
