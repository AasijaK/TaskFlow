<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Details — TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/task-form.css">
</head>
<body class="app-page">

  <div class="app-shell">
    <!-- Sidebar Navigation (Shared) -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <a href="index.html" class="nav-logo">Task<span>Flow</span></a>
      </div>

      <nav class="sidebar-nav">
        <ul class="nav-list">
          <li>
            <a href="dashboard.html" class="nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="tasks.html" class="nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
              <span>All Tasks</span>
            </a>
          </li>
          <li>
            <a href="categories.html" class="nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Categories</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">JD</div>
          <div class="user-info">
            <span class="user-name">User Name</span>
            <a href="settings.html" class="user-settings-link">Settings</a>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile Nav Toggle -->
    <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle navigation">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="page-header">
        <div class="header-title-area">
          <h1 id="formTitle">Create Task</h1>
          <p class="text-muted">Fill in the details to organize your work.</p>
        </div>
      </header>

      <div class="form-container">
        <div class="card">
          <form id="taskForm" novalidate>
            <div class="form-row">
              <div class="form-group full-width">
                <label for="title" class="form-label">Task Title <span class="required">*</span></label>
                <input type="text" id="title" name="title" placeholder="e.g., Finish project proposal" required>
                <span class="error-message" id="titleError">Title is required.</span>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group full-width">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" name="description" rows="4" placeholder="Add more details about this task..."></textarea>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="status" class="form-label">Status</label>
                <select id="status" name="status">
                  <option value="pending">Pending</option>
                  <option value="in-progress">In Progress</option>
                  <option value="completed">Completed</option>
                </select>
              </div>

              <div class="form-group">
                <label for="priority" class="form-label">Priority</label>
                <select id="priority" name="priority">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>

              <div class="form-group">
                <label for="dueDate" class="form-label">Due Date</label>
                <input type="date" id="dueDate" name="dueDate">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group full-width">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category">
                  <option value="">None</option>
                  <!-- Categories will be populated by backend -->
                </select>
                <p class="helper-text">Categories are not yet available.</p>
              </div>
            </div>

            <div class="form-actions">
              <a href="tasks.html" class="btn btn-ghost">Cancel</a>
              <button type="submit" id="saveBtn" class="btn btn-primary">Save Task</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/dashboard.js"></script>
  <script src="js/task-form.js"></script>
</body>
</html>
