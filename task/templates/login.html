{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — TaskFlow</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="{% url 'Home' %}" class="nav-logo">Task<span>Flow</span></a>
          <h1>Welcome back</h1>
          <p class="text-muted">Enter your details to manage your tasks with clarity.</p>
        </div>

        <form id="loginForm" method="POST" novalidate>
          {% csrf_token %}
          <div class="form-group">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
            <span class="error-message" id="emailError">Please enter a valid email address.</span>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="password" class="form-label">Password</label>
              <a href="#" class="forgot-link" title="Password recovery page (Coming Soon)">Forgot password?</a>
            </div>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" placeholder="••••••••" required>
              <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span class="error-message" id="passwordError">Password is required.</span>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" name="remember">
              <span class="checkbox-label">Remember me</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="{% url 'Register' %}" class="auth-link">Create one</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
